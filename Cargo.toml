[workspace]
members = ["crates/ibis2ibstoml"]
resolver = "3"

[package]
name = "ibis_parser"
version = "0.1.0"
edition = "2024"

[dependencies]
tauri = { version = "2.11.3", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
ibis2ibstoml = { path = "crates/ibis2ibstoml" }

[build-dependencies]
tauri-build = { version = "2.6" }
