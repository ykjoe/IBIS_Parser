[workspace]
members = ["crates/ibis2ibstoml", "crates/ibstoml_extrator", "crates/ibstoml_schema"]
resolver = "3"

[package]
name = "ibis_parser"
version = "0.1.0"
edition = "2024"

[dependencies]
# local
ibis2ibstoml = { path = "crates/ibis2ibstoml" }
ibstoml_extrator = { path = "crates/ibstoml_extrator" }

# cargo
clap = { version = "4.5", features = ["derive"] }
colored = "3.0"
