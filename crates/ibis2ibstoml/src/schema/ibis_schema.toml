        d_overshoot_area_l = "corner"
        d_overshoot_ampl_h = "corner"
        d_overshoot_ampl_l = "corner"
        pulse_high = "corner"
        pulse_low = "corner"
        pulse_time = "corner"
        vmeas = "corner"
        cref = "corner"
        rref = "corner"
        vref = "corner"
        cref_rising = "corner"
        cref_falling = "corner"
        rref_rising = "corner"
        rref_falling = "corner"
        vref_rising = "corner"
        vref_falling = "corner"
