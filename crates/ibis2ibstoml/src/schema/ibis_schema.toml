# =============================================================================
# ibis_schema.toml — IBIS 7.0 结构（唯一 IBIS 结构数据源）
#
# 核心约定：
#   - 每个 keyword 下都有同名 section（哪怕它是空的）；
#   - `[]` 内节段名按 IBIS 手册写法（如 [Component.Pin]、[Model.Ramp]）；
#   - 第一个字段名 = keyword 名本身（全小写）；
#   - 字段的 **类型 / 规范名** 由 `schema/keyword_hierarchy.rs` 的结构体字段定义
#     （单一来源），本文件字段名（key）与属性值均**全小写**，与结构体字段对齐。
#
# 格式（与 plans/ibis_struct.toml 一致）：
#   [Section]       单实例 keyword 的同名 section（TOML 单表）
#   [[Section]]     多实例 keyword 的同名 section（TOML 数组表）
#   key = "spec_name"   字段名 = 全小写属性值
#
# 用途：backend 结构校验（keyword_valid）、symbol_table_build 的通用递归解释器
#       （节段 / 字段 / 树关系）、frontend pest 生成、示例模板
# =============================================================================

# -----------------------------------------------------------------------------
# 文件头（虚拟容器，其字段名即 keyword 名）
# -----------------------------------------------------------------------------
[File_Header]
"ibis_ver" = "ibis_ver"
"comment_char" = "comment_char"
"file_name" = "file_name"
"file_rev" = "file_rev"
"date" = "date"
"source" = "source"
"notes" = "notes"
"disclaimer" = "disclaimer"
"copyright" = "copyright"

