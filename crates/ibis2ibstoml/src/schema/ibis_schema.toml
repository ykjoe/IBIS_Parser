        vinh_dc = "quantity"
        vinl_ac = "quantity"
        vinl_dc = "quantity"
        threshold_sensitivity = "text"
        reference_supply = "text"
        vcross_low = "quantity"
        vcross_high = "quantity"
        vdiff_ac = "quantity"
        vdiff_dc = "quantity"
        tslew_ac = "quantity"
        tdiffslew_ac = "quantity"

    [Model.C_Comp_Corner]
    __schema__ = {required = false, format = "text"}
    __header__ = {format = "none"}

        [Model.C_Comp_Corner.__param__]
        c_comp = "corner"
        c_comp_pullup = "corner"
        c_comp_pulldown = "corner"
        c_comp_power_clamp = "corner"
        c_comp_gnd_clamp = "corner"

    [Model.Temperature_Range]
    __schema__ = {required = false, format = "text"}
    __header__ = {format = "corner"}
