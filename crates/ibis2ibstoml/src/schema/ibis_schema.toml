# =============================================================================
# ibis_schema.toml — IBIS 7.0 结构（唯一 IBIS 结构数据源）
#
# 组织约定：
#   - 每个 keyword 一个同名 section（`[X]` 单实例 / `[[X]]` 多实例）；
#   - 子 keyword 写作父节段的子表（如 `[Component.Pin]`、`[Model.Ramp]`）；
#   - 每个 section 均含三个元数据键，描述该 keyword 的结构：
#
#       __schema__ = {required = <bool>, format = "<kind>"}
#           required — 该 keyword 是否必须出现；
#           format   — 该 keyword 下 header / param / 文本体如何组织：
#                      "file_header" 文件头条目
#                      "text"        单条记录（标识符可入 header，其余入 param）
#                      "textlines"   多行自由文本
#                      "table"       表格或列表（行式数据）
#                      "IV-table"    I-V 曲线表；列名固定为 Voltage / I(typ) / I(min) / I(max)
#                      "VT-table"    V-t 波形表；fixture param 照常解析，其余行成表，
#                                    列名固定为 Time / V(typ) / V(min) / V(max)
#
#       __header__ = {format = "<kind>"}
#           keyword 之后同一行紧跟的文字如何组织：
#                      "none"         关键字后无文字
#                      "text"         一个文本 / 标识符 token
#                      "textlines"    多行自由文本
#                      "table_header" 表头行（列名）
#                      "corner"       一个 corner 三元组（typ min max）
#
#       __param__ = "none" | { name = "<type>", ... } | [X.__param__]
#           该 keyword 携带的具名 sub-parameter；条目较多时另起
#           `[X.__param__]` 子表。type ∈ {text, quantity, corner}：
#                      text     文本 / 枚举 / 名称
#                      quantity 带单位的物理量（数值 + 单位）
#                      corner   角点三元组（typ min max）
#
# 行式 section 的首列：IBIS 手册的表头行常常不给第一列命名（数据的首列是
# pin_name / pad_name / 域名等标识符），例如
#
#     [Pin] signal_name model_name R_pin L_pin C_pin
#     1     RAS0#       Buffer1    200.0m 5.0nH 2.0pF
#
# 数据行比表头多出一列。此类「手册未命名」的首列统一记为 `col0`，并声明为
# `__param__` 的第一项，使列名与数据列一一对齐；手册确实给出名字的首列
# （如 [Series Switch Groups] 的 On/Off、[Add Submodel] 的 submodel_name）沿用原名。
#
# 用途：backend 结构校验、symbol_table_build 通用递归解释器、frontend 关键字
#       层级判定（find_level）、示例模板。
# =============================================================================

# -----------------------------------------------------------------------------
# File Header
# -----------------------------------------------------------------------------
[IBIS_Ver]
__schema__ = {required = true, format = "file_header"}
__header__ = {format = "text"}
__param__  = "none"

[Comment_Char]
__schema__ = {required = false, format = "file_header"}
__header__ = {format = "text"}
__param__  = "none"

[File_Name]
__schema__ = {required = true, format = "file_header"}
__header__ = {format = "text"}
__param__  = "none"

[File_Rev]
__schema__ = {required = true, format = "file_header"}
__header__ = {format = "text"}
__param__  = "none"

[Date]
__schema__ = {required = false, format = "file_header"}
__header__ = {format = "text"}
__param__  = "none"

[Source]
__schema__ = {required = false, format = "file_header"}
__header__ = {format = "textlines"}
__param__  = "none"

[Notes]
__schema__ = {required = false, format = "file_header"}
__header__ = {format = "textlines"}
__param__  = "none"

[Disclaimer]
__schema__ = {required = false, format = "file_header"}
__header__ = {format = "textlines"}
__param__  = "none"

[Copyright]
__schema__ = {required = false, format = "file_header"}
__header__ = {format = "text"}
__param__  = "none"


# -----------------------------------------------------------------------------
# Component
# -----------------------------------------------------------------------------
[[Component]]
__schema__ = {required = true, format = "text"}
__header__ = {format = "text"}
__param__  = {si_location = "text", timing_location = "text"}

    [Component.Manufacturer]
    __schema__ = {required = true, format = "text"}
    __header__ = {format = "none"}
    __param__  = "none"

    [Component.Package]
    __schema__ = {required = true, format = "text"}
    __header__ = {format = "none"}
    __param__  = {r_pkg = "corner", l_pkg = "corner", c_pkg = "corner"}

    [Component.Pin]
    __schema__ = {required = true, format = "table"}
    __header__ = {format = "table_header"}
        [Component.Pin.__param__]
        col0 = "text"
        signal_name = "text"
        model_name = "text"
        R_pin = "quantity"
        L_pin = "quantity"
        C_pin = "quantity"

    [Component.Package_Model]
    __schema__ = {required = false, format = "text"}
    __header__ = {format = "text"}
    __param__  = "none"

        [Component.Package_Model.Alternate_Package_Models]
        __schema__ = {required = false, format = "table"}
        __header__ = {format = "none"}
        __param__  = "none"

    [[Component.Interconnect_Model_Group]]
    __schema__ = {required = false, format = "table"}
    __header__ = {format = "text"}
    __param__  = "none"

    [[Component.Pin_Mapping]]
    __schema__ = {required = false, format = "table"}
    __header__ = {format = "table_header"}

        [Component.Pin_Mapping.__param__]
        col0 = "text"
        pulldown_ref = "text"
        pullup_ref = "text"
        gnd_clamp_ref = "text"
        power_clamp_ref = "text"
        ext_ref = "text"

    [[Component.Series_Pin_Mapping]]
    __schema__ = {required = false, format = "table"}
    __header__ = {format = "table_header"}

        [Component.Series_Pin_Mapping.__param__]
        col0 = "text"
        pin_2 = "text"
        model_name = "text"
        function_table_group = "text"

    [[Component.Diff_Pin]]
    __schema__ = {required = false, format = "table"}
    __header__ = {format = "table_header"}

        [Component.Diff_Pin.__param__]
        col0 = "text"
        inv_pin = "text"
        vdiff = "quantity"
        tdelay_typ = "quantity"
        tdelay_min = "quantity"
        tdelay_max = "quantity"

    [[Component.Differential_Pin_Mapping]]
    __schema__ = {required = false, format = "table"}
    __header__ = {format = "table_header"}

        [Component.Differential_Pin_Mapping.__param__]
        inv_pin = "text"
        vdiff = "quantity"
        tdelay_typ = "quantity"
        tdelay_min = "quantity"
        tdelay_max = "quantity"

    [[Component.Bus_Label]]
    __schema__ = {required = false, format = "table"}
    __header__ = {format = "table_header"}
    __param__  = {col0 = "text", signal_name = "text"}

    [[Component.Die_Supply_Pads]]
    __schema__ = {required = false, format = "table"}
    __header__ = {format = "table_header"}
    __param__  = {col0 = "text", signal_name = "text", bus_label = "text"}

    [[Component.Repeater_Pin]]
    __schema__ = {required = false, format = "table"}
    __header__ = {format = "table_header"}
    __param__  = {col0 = "text", tx_non_inv_pin = "text"}

    [[Component.Series_Switch_Groups]]
    __schema__ = {required = false, format = "table"}
    __header__ = {format = "table_header"}
    __param__  = {on = "text", off = "text"}

    [Component.Node_Declarations]
    __schema__ = {required = false, format = "table"}
    __header__ = {format = "none"}
    __param__  = "none"

    [[Component.Circuit_Call]]
    __schema__ = {required = false, format = "table"}
    __header__ = {format = "table_header"}

        [Component.Circuit_Call.__param__]
        signal_pin = "text"
        diff_signal_pins = "text"
        series_pins = "text"
        port_map = "text"
        converter_parameters = "text"
        parameters = "text"

    [Component.Begin_EMI_Component]
    __schema__ = {required = false, format = "text"}
    __header__ = {format = "text"}
    __param__  = {cpd = "quantity", c_heatsink_gnd = "quantity", c_heatsink_float = "quantity"}

        [[Component.Begin_EMI_Component.Pin_EMI]]
        __schema__ = {required = false, format = "table"}
        __header__ = {format = "table_header"}
        # 手册：「Each line must contain three columns. The first column shall
        # contain the pin name.」——首列是引脚名，表头行（domain_name clock_div）
        # 只命名了后两列。
        __param__  = {col0 = "text", domain_name = "text", clock_div = "text"}

        [[Component.Begin_EMI_Component.Pin_Domain_EMI]]
        __schema__ = {required = false, format = "table"}
        __header__ = {format = "table_header"}
        # 手册：「The first column must contain the domain_name.」——首列是域名，
        # 表头行（percentage）只命名了百分比列。
        __param__  = {col0 = "text", percentage = "quantity"}

