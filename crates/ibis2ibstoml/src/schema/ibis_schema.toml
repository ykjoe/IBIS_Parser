    [Model.Voltage_Range]
    __schema__ = {required = false, format = "text"}
    __header__ = {format = "corner"}
    __param__  = "none"

    [Model.Pullup_Reference]
    __schema__ = {required = false, format = "text"}
    __header__ = {format = "corner"}
    __param__  = "none"

    [Model.Pulldown_Reference]
    __schema__ = {required = false, format = "text"}
    __header__ = {format = "corner"}
