    __header__ = {format = "none"}

        # The [Model Spec] parameter list and order come from the IBIS 7.0 manual;
        # all entries are corner triples (typ min max).
        [Model.Model_Spec.__param__]
        vinh = "corner"
        vinl = "corner"
        "vinh+" = "corner"
        "vinh-" = "corner"
        "vinl+" = "corner"
        "vinl-" = "corner"
        s_overshoot_high = "corner"
        s_overshoot_low = "corner"
        d_overshoot_high = "corner"
        d_overshoot_low = "corner"
        d_overshoot_time = "corner"
        d_overshoot_area_h = "corner"
        d_overshoot_area_l = "corner"
        d_overshoot_ampl_h = "corner"
        d_overshoot_ampl_l = "corner"
        pulse_high = "corner"
        pulse_low = "corner"
        pulse_time = "corner"
        vmeas = "corner"
        cref = "corner"
        rref = "corner"
        vref = "corner"
        cref_rising = "corner"
        cref_falling = "corner"
        rref_rising = "corner"
        rref_falling = "corner"
        vref_rising = "corner"
        vref_falling = "corner"
        vmeas_rising = "corner"
        vmeas_falling = "corner"
        rref_diff = "corner"
        cref_diff = "corner"
        weak_r = "corner"
        weak_i = "corner"
        weak_v = "corner"

    [Model.Receiver_Thresholds]
    __schema__ = {required = false, format = "text"}
    __header__ = {format = "none"}

        [Model.Receiver_Thresholds.__param__]
        vth = "quantity"
        vth_min = "quantity"
        vth_max = "quantity"
        vinh_ac = "quantity"
        vinh_dc = "quantity"
        vinl_ac = "quantity"
        vinl_dc = "quantity"
        threshold_sensitivity = "text"
        reference_supply = "text"
        vcross_low = "quantity"
        vcross_high = "quantity"
        vdiff_ac = "quantity"
        vdiff_dc = "quantity"
        tslew_ac = "quantity"
        tdiffslew_ac = "quantity"

    [Model.C_Comp_Corner]
    __schema__ = {required = false, format = "text"}
    __header__ = {format = "none"}

        [Model.C_Comp_Corner.__param__]
        c_comp = "corner"
        c_comp_pullup = "corner"
        c_comp_pulldown = "corner"
        c_comp_power_clamp = "corner"
        c_comp_gnd_clamp = "corner"

    [Model.Temperature_Range]
    __schema__ = {required = false, format = "text"}
    __header__ = {format = "corner"}
    __param__  = "none"

    [Model.Voltage_Range]
    __schema__ = {required = false, format = "text"}
    __header__ = {format = "corner"}
    __param__  = "none"

    [Model.Pullup_Reference]
    __schema__ = {required = false, format = "text"}
    __header__ = {format = "corner"}
    __param__  = "none"

    [Model.Pulldown_Reference]
    __schema__ = {required = false, format = "text"}
    __header__ = {format = "corner"}
    __param__  = "none"

    [Model.Power_Clamp_Reference]
    __schema__ = {required = false, format = "text"}
    __header__ = {format = "corner"}
    __param__  = "none"

    [Model.GND_Clamp_Reference]
    __schema__ = {required = false, format = "text"}
    __header__ = {format = "corner"}
    __param__  = "none"

    [Model.External_Reference]
    __schema__ = {required = false, format = "text"}
    __header__ = {format = "corner"}
    __param__  = "none"

    [Model.Ramp]
    __schema__ = {required = false, format = "text"}
    __header__ = {format = "none"}
    __param__  = {"dv/dt_r" = "corner", "dv/dt_f" = "corner", r_load = "quantity"}

    [Model.Pulldown]
    __schema__ = {required = false, format = "IV-table"}
    __header__ = {format = "table_header"}
    __param__  = "none"

    [Model.Pullup]
    __schema__ = {required = false, format = "IV-table"}
    __header__ = {format = "table_header"}
    __param__  = "none"

    [Model.GND_Clamp]
    __schema__ = {required = false, format = "IV-table"}
    __header__ = {format = "table_header"}
    __param__  = "none"

    [Model.Power_Clamp]
    __schema__ = {required = false, format = "IV-table"}
    __header__ = {format = "table_header"}
