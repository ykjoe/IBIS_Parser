    __header__ = {format = "none"}

        [Model.Rising_Waveform.__param__]
        r_fixture = "quantity"
        v_fixture = "quantity"
        v_fixture_min = "quantity"
        v_fixture_max = "quantity"
        c_fixture = "quantity"
        l_fixture = "quantity"
        r_dut = "quantity"
        l_dut = "quantity"
        c_dut = "quantity"

        [Model.Rising_Waveform.Composite_Current]
        __schema__ = {required = false, format = "IV-table"}
        __header__ = {format = "table_header"}
        __param__  = "none"

    [[Model.Falling_Waveform]]
