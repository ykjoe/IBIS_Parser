# =============================================================================
# ibis_schema.toml — IBIS 7.0 structure (the single IBIS structure data source)
#
# Organization conventions:
#   - one section per keyword, named identically (`[X]` single / `[[X]]` multiple);
#   - a child keyword is written as a sub-table of its parent section
#     (for example `[Component.Pin]`, `[Model.Ramp]`);
#   - every section carries three metadata keys describing the keyword structure:
#
#       __schema__ = {required = <bool>, format = "<kind>"}
#           required — whether the keyword must appear;
#           format   — how the header / params / body text below the keyword are
#                      organized:
#                      "file_header" a file header entry
#                      "text"        a single record (identifier may go to header, the rest to params)
#                      "textlines"   free text spanning several lines
#                      "table"       tabular or list-shaped data (row-oriented)
#                      "IV-table"    I-V curve table; columns fixed to Voltage / I(typ) / I(min) / I(max)
#                      "VT-table"    V-t waveform table; fixture params parsed as usual, remaining rows
#                                    form a table with columns fixed to Time / V(typ) / V(min) / V(max)
#
#       __header__ = {format = "<kind>"}
#           how the text on the same line right after the keyword is organized:
#                      "none"         no text after the keyword
#                      "text"         a single text / identifier token
#                      "textlines"    free text spanning several lines
#                      "table_header" a header row naming the columns
#                      "corner"       a corner triple (typ min max)
#
#       __param__ = "none" | { name = "<type>", ... } | [X.__param__]
#           the named sub-parameters of the keyword; when there are many entries,
#           use a separate `[X.__param__]` sub-table. type ∈ {text, quantity, corner}:
#                      text     text / enumeration / name
#                      quantity a physical quantity with a unit (number + unit)
#                      corner   a corner triple (typ min max)
#
# First column of a row-oriented section: the IBIS manual's header row often does
# not name the first column (the first data column is an identifier such as
# pin_name / pad_name / domain name), for example
#
#     [Pin] signal_name model_name R_pin L_pin C_pin
#     1     RAS0#       Buffer1    200.0m 5.0nH 2.0pF
#
# The data row has one more column than the header. Such unnamed first columns are
# recorded uniformly as `col0` and declared as the first `__param__` entry, so the
# column names line up with the data columns; a first column the manual does name
# (such as On/Off of [Series Switch Groups] and submodel_name of [Add Submodel])
# keeps its original name.
#
# Used by: backend structural validation, the symbol_table_build generic recursive
#          interpreter, frontend keyword level resolution (find_level), and example templates.
# =============================================================================

# -----------------------------------------------------------------------------
# File Header
# -----------------------------------------------------------------------------
[IBIS_Ver]
__schema__ = {required = true, format = "file_header"}
__header__ = {format = "text"}
__param__  = "none"

[Comment_Char]
__schema__ = {required = false, format = "file_header"}
__header__ = {format = "text"}
__param__  = "none"

[File_Name]
__schema__ = {required = true, format = "file_header"}
__header__ = {format = "text"}
__param__  = "none"

[File_Rev]
__schema__ = {required = true, format = "file_header"}
__header__ = {format = "text"}
__param__  = "none"

[Date]
__schema__ = {required = false, format = "file_header"}
__header__ = {format = "text"}
__param__  = "none"

[Source]
__schema__ = {required = false, format = "file_header"}
__header__ = {format = "textlines"}
__param__  = "none"

[Notes]
__schema__ = {required = false, format = "file_header"}
__header__ = {format = "textlines"}
__param__  = "none"

[Disclaimer]
__schema__ = {required = false, format = "file_header"}
__header__ = {format = "textlines"}
__param__  = "none"

[Copyright]
__schema__ = {required = false, format = "file_header"}
__header__ = {format = "text"}
__param__  = "none"


# -----------------------------------------------------------------------------
# Component
# -----------------------------------------------------------------------------
[[Component]]
__schema__ = {required = true, format = "text"}
__header__ = {format = "text"}
__param__  = {si_location = "text", timing_location = "text"}

    [Component.Manufacturer]
    __schema__ = {required = true, format = "text"}
    __header__ = {format = "none"}
    __param__  = "none"

    [Component.Package]
    __schema__ = {required = true, format = "text"}
    __header__ = {format = "none"}
    __param__  = {r_pkg = "corner", l_pkg = "corner", c_pkg = "corner"}

    [Component.Pin]
    __schema__ = {required = true, format = "table"}
    __header__ = {format = "table_header"}
        [Component.Pin.__param__]
        col0 = "text"
        signal_name = "text"
        model_name = "text"
        R_pin = "quantity"
        L_pin = "quantity"
        C_pin = "quantity"

    [Component.Package_Model]
    __schema__ = {required = false, format = "text"}
    __header__ = {format = "text"}
    __param__  = "none"

        [Component.Package_Model.Alternate_Package_Models]
        __schema__ = {required = false, format = "table"}
        __header__ = {format = "none"}
        __param__  = "none"

    [[Component.Interconnect_Model_Group]]
    __schema__ = {required = false, format = "table"}
    __header__ = {format = "text"}
    __param__  = "none"

    [[Component.Pin_Mapping]]
    __schema__ = {required = false, format = "table"}
    __header__ = {format = "table_header"}

        [Component.Pin_Mapping.__param__]
        col0 = "text"
        pulldown_ref = "text"
        pullup_ref = "text"
        gnd_clamp_ref = "text"
        power_clamp_ref = "text"
        ext_ref = "text"

    [[Component.Series_Pin_Mapping]]
    __schema__ = {required = false, format = "table"}
    __header__ = {format = "table_header"}

        [Component.Series_Pin_Mapping.__param__]
        col0 = "text"
        pin_2 = "text"
        model_name = "text"
        function_table_group = "text"

    [[Component.Diff_Pin]]
    __schema__ = {required = false, format = "table"}
    __header__ = {format = "table_header"}

        [Component.Diff_Pin.__param__]
        col0 = "text"
        inv_pin = "text"
        vdiff = "quantity"
        tdelay_typ = "quantity"
        tdelay_min = "quantity"
        tdelay_max = "quantity"

    [[Component.Differential_Pin_Mapping]]
    __schema__ = {required = false, format = "table"}
    __header__ = {format = "table_header"}

        [Component.Differential_Pin_Mapping.__param__]
        inv_pin = "text"
        vdiff = "quantity"
        tdelay_typ = "quantity"
        tdelay_min = "quantity"
        tdelay_max = "quantity"

    [[Component.Bus_Label]]
    __schema__ = {required = false, format = "table"}
    __header__ = {format = "table_header"}
    __param__  = {col0 = "text", signal_name = "text"}

    [[Component.Die_Supply_Pads]]
    __schema__ = {required = false, format = "table"}
    __header__ = {format = "table_header"}
    __param__  = {col0 = "text", signal_name = "text", bus_label = "text"}

    [[Component.Repeater_Pin]]
    __schema__ = {required = false, format = "table"}
    __header__ = {format = "table_header"}
    __param__  = {col0 = "text", tx_non_inv_pin = "text"}

    [[Component.Series_Switch_Groups]]
    __schema__ = {required = false, format = "table"}
    __header__ = {format = "table_header"}
    __param__  = {on = "text", off = "text"}

    [Component.Node_Declarations]
    __schema__ = {required = false, format = "table"}
    __header__ = {format = "none"}
    __param__  = "none"

    [[Component.Circuit_Call]]
    __schema__ = {required = false, format = "table"}
    __header__ = {format = "table_header"}

        [Component.Circuit_Call.__param__]
        signal_pin = "text"
        diff_signal_pins = "text"
        series_pins = "text"
        port_map = "text"
        converter_parameters = "text"
        parameters = "text"

    [Component.Begin_EMI_Component]
    __schema__ = {required = false, format = "text"}
    __header__ = {format = "text"}
    __param__  = {cpd = "quantity", c_heatsink_gnd = "quantity", c_heatsink_float = "quantity"}

        [[Component.Begin_EMI_Component.Pin_EMI]]
        __schema__ = {required = false, format = "table"}
        __header__ = {format = "table_header"}
        # Manual: "Each line must contain three columns. The first column shall
        # contain the pin name." — the first column is the pin name; the header
        # row (domain_name clock_div) names only the last two columns.
        __param__  = {col0 = "text", domain_name = "text", clock_div = "text"}

        [[Component.Begin_EMI_Component.Pin_Domain_EMI]]
        __schema__ = {required = false, format = "table"}
        __header__ = {format = "table_header"}
        # Manual: "The first column must contain the domain_name." — the first
        # column is the domain name; the header row (percentage) names only the
        # percentage column.
        __param__  = {col0 = "text", percentage = "quantity"}

