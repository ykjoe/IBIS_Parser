    vinh = "quantity"
    c_comp = "corner"
    c_comp_pullup = "corner"
    c_comp_pulldown = "corner"
    c_comp_power_clamp = "corner"
    c_comp_gnd_clamp = "corner"
    vmeas = "quantity"
    cref = "quantity"
    rref = "quantity"
    vref = "quantity"
    rref_diff = "quantity"
    cref_diff = "quantity"
    ttgnd = "quantity"
    ttpower = "quantity"
    rgnd = "quantity"
    rpower = "quantity"
    rac = "quantity"
    cac = "quantity"
    on = "quantity"
    off = "quantity"
    r_series = "quantity"
    l_series = "quantity"
    rl_series = "quantity"
    c_series = "quantity"
    lc_series = "quantity"
    rc_series = "quantity"
    vds = "quantity"
    driver_schedule = "text"
    threshold_sensitivity = "text"
    reference_supply = "text"

    [Model.Model_Spec]
